name: Security Audit

on:
  # An advisory can be published against a dependency that has been in the lockfiles for
  # months. The dependency-review job only inspects packages a pull request adds, so it
  # cannot see a later advisory against a package that was already there. This is the job
  # that catches that case, and it is why it runs on a schedule rather than only on PRs.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - package-lock.json

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Cargo.lock is what ships, so this is the audit that matters for the application.
      # `cargo audit` fails on a vulnerability and reports unmaintained or unsound crates as
      # warnings, which is the intended threshold here.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  node:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The frontend dependencies are build- and test-time only, but a vulnerable one is
      # still worth a red build rather than a surprise in an email.
      - run: npm audit --audit-level=high
